name: App regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and validate deployed script assets
        run: node scripts/build-site.cjs
      - name: Run bookkeeping and security regression checks
        run: npm test
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Check browser forms at phone viewport
        run: npm run test:browser
